[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-support-agent"
version = "0.1.0"
description = "Customer-support agent for an online shop: tool calling, guardrails, policy engine and scenario evals"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Akib Jafor" }]
requires-python = ">=3.10"
keywords = ["agents", "tool-calling", "guardrails", "llm", "evals", "fastapi", "customer-support"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5,<3.0",
  "pydantic-settings>=2.1",
  "httpx>=0.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.3",
]

[project.scripts]
agent-eval = "support_agent.evals.cli:main"
support-agent = "support_agent.cli:main"

[tool.setuptools.packages.find]
include = ["support_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Reply templates and intent/injection patterns read better unwrapped.
"support_agent/llm/fake.py" = ["E501"]
"support_agent/guardrails.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["support_agent"]
