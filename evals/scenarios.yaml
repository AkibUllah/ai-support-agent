# Scripted conversations that assert tool calls, guardrail events, replies and the
# resulting database state. Run with: agent-eval run
#
# Per turn (all optional):
#   tools: exact sequence of tool names called this turn ([] = no tools)
#   status: {tool_name: ok|error|invalid_arguments}
#   guardrails: guardrail names that must fire this turn
#   reply_contains / reply_not_contains: substrings (case-insensitive)
#   state: session state after the turn (active | handoff)
# Per scenario `outcome` (checked after the last turn):
#   refunds: {order_id: approved | pending_review | none}
#   tickets: exact number of tickets created during the scenario
#   address_contains: {order_id: substring of the shipping address}
#   address_unchanged: [order_id, ...]
#   audit: audit events that must exist;  never_called: tools that must not run at all

# ---------------------------------------------------------------- happy paths
- id: greeting
  category: happy_path
  customer: C001
  turns:
    - user: "Hi there"
      expect: {tools: [], reply_contains: ["Rahim", "track orders"]}

- id: track-dispatched-order
  category: happy_path
  customer: C001
  turns:
    - user: "Where is my order HO-10024?"
      expect:
        tools: [track_shipment]
        status: {track_shipment: ok}
        reply_contains: ["Padma Courier", "PC-882310", "Out for delivery", "Dhaka time"]

- id: lookup-delivered-order
  category: happy_path
  customer: C001
  turns:
    - user: "Can you show me the details of HO-10021"
      expect:
        tools: [lookup_order]
        reply_contains: ["delivered", "৳2,450", "Wireless earbuds"]

- id: list-recent-orders
  category: happy_path
  customer: C002
  turns:
