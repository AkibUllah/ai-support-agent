      expect:
        tools: [list_recent_orders]
        reply_contains: ["HO-10034", "HO-10031"]
        reply_not_contains: ["HO-10021"]

- id: refund-auto-approve-bkash
  category: happy_path
  customer: C001
  turns:
    - user: "I want a refund for HO-10021, the earbuds stopped working"
      expect:
        tools: [initiate_refund]
        guardrails: [refund_policy]
        reply_contains: ["approved", "৳2,450", "bKash", "3 working days"]
